pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "bat_connect_demo"
include ":app"

def localPropertiesFile = new File(rootDir, "local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> properties.load(stream) }
}

def flutterSdkPath = properties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

def flutterRoot = file(flutterSdkPath).absoluteFile.getParentFile().getAbsolutePath()

gradle.beforeProject { Project project ->
    def dartPluginVersion = "4.8.1"
    if (project.plugins.hasPlugin('dart-flutter')) {
        println "Overriding dart-flutter plugin version to $dartPluginVersion"
    }
}
